name: install-test
on:
  workflow_dispatch:
  push:
    paths: ['install.sh', 'install.ps1', 'commands/**', '.github/workflows/install-test.yml']
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Install bonuses exactly like an owner (Windows PowerShell 5.1)
        shell: powershell
        run: |
          Start-Sleep -Seconds 30
          irm https://raw.githubusercontent.com/LaughlinBusinessAdvisors/lba-ai-bonuses/main/install.ps1 | iex
      - name: Check files, folder and safety locks
        shell: powershell
        run: |
          $d = Join-Path $HOME ".claude\commands\lba"
          $n = (Get-ChildItem $d -Filter *.md).Count
          Write-Host "Commands installed: $n"
          if ($n -ne 12) { throw "Expected 12 commands" }
          if (Test-Path (Join-Path $d "handoff.md")) { throw "old command left behind" }
          $s = Get-Content (Join-Path $HOME "My Business Brain\.claude\settings.json") -Raw | ConvertFrom-Json
          Write-Host "Safety locks: $($s.permissions.deny.Count)"
          cd ~/"My Business Brain"; Write-Host "Mac-style cd works: $(Get-Location)"
          cd "$HOME\My Business Brain"; Write-Host "Windows cd works: $(Get-Location)"
          Select-String -Path (Join-Path $d "start.md") -Pattern "on Windows" | Out-Null
      - name: Run installer a second time (re-install must not break)
        shell: powershell
        run: irm https://raw.githubusercontent.com/LaughlinBusinessAdvisors/lba-ai-bonuses/main/install.ps1 | iex
      - name: Install Claude Code the way Anthropic's docs say
        shell: powershell
        run: |
          irm https://claude.ai/install.ps1 | iex
      - name: Fresh window finds claude
        shell: powershell
        run: |
          $env:Path = [Environment]::GetEnvironmentVariable("Path","User") + ";" + [Environment]::GetEnvironmentVariable("Path","Machine")
          claude --version
  mac:
    runs-on: macos-latest
    steps:
      - name: Install bonuses exactly like an owner
        run: |
          sleep 30
          curl -fsSL https://raw.githubusercontent.com/LaughlinBusinessAdvisors/lba-ai-bonuses/main/install.sh | bash
      - name: Check files, folder and safety locks
        run: |
          n=$(ls ~/.claude/commands/lba/*.md | wc -l | tr -d ' ')
          echo "Commands installed: $n"; test "$n" = 12
          python3 -c "import json,os;print('Safety locks:',len(json.load(open(os.path.expanduser('~/My Business Brain/.claude/settings.json')))['permissions']['deny']))"
          cd ~/"My Business Brain" && pwd
      - name: Install Claude Code the way Anthropic's docs say
        run: curl -fsSL https://claude.ai/install.sh | bash
      - name: Fresh window finds claude
        run: zsh -lic 'claude --version' || ~/.local/bin/claude --version
